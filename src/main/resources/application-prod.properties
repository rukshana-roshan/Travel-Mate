# ============================================
# Travel Mate - Production Configuration (Render)
# Activated with SPRING_PROFILES_ACTIVE=prod. Every value below is pulled
# from an environment variable so no secrets ever live in source control —
# set these in the Render dashboard under the service's "Environment" tab.
# ============================================

server.port=${PORT:8080}

# ---------- MySQL Datasource ----------
# Render's managed MySQL (or any external MySQL host) connection details.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# 'validate' (not 'update') in production: the schema is created once via
# schema_and_seed_data.sql, and Hibernate should never silently alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null

# ---------- Logging ----------
logging.level.org.springframework=WARN
logging.level.com.travelmate=INFO
