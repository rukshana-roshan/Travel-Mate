# ============================================
# Travel Mate - Test Configuration
# Uses an in-memory H2 database so the test suite never touches the real
# MySQL instance and can run anywhere (including CI) with zero setup.
# ============================================

spring.datasource.url=jdbc:h2:mem:travel_mate_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
